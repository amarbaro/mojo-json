# rattler-build recipe, modular-community shape.
# Build locally: rattler-build build -r recipe.yaml -c https://conda.modular.com/max -c conda-forge
context:
  version: 0.1.3

package:
  name: "mojo-json"
  version: ${{ version }}

source:
  - path: .

build:
  number: 0
  script:
    - mojo precompile src/json -o ${{ PREFIX }}/lib/mojo/json.mojoc

requirements:
  host:
    - mojo-compiler >=1.2.0,<1.3
  build:
    - mojo-compiler >=1.2.0,<1.3
  run:
    - ${{ pin_compatible('mojo-compiler', upper_bound='x.x') }}  # .mojoc loads only on the minor it was built with

tests:
  - script:
    - if: unix
      then:
        - mojo build -I src examples/quickstart.mojo -o quickstart
    files:
      source:
        - src/
        - examples/

about:
  homepage: https://github.com/amarbaro/mojo-json
  license: Apache-2.0
  license_file: LICENSE
  summary: JSON for Mojo, byte-identical with Python json
  repository: https://github.com/amarbaro/mojo-json

extra:
  maintainers:
    - amarbaro.org
  project_name:
    - mojo-json
